schema_version: '1.0'
authority_language: zh-CN
code_identifier_language: en
terms:
- term_id: TERM-R2-001
  zh_cn: 规则
  code: RULE
  definition: 世界或高权限载体可执行的条件化因果约束；不等同于世界内文字。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-002
  zh_cn: 规则文本
  code: RULE_TEXT
  definition: 对规则的记录、解释、误导或高权限载体表现。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-003
  zh_cn: 规则域
  code: RULE_DOMAIN
  definition: 一组在特定空间、时间、身份或状态下共同适用的规则范围。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-004
  zh_cn: 规则残差
  code: RULE_RESIDUE
  definition: 旧规则或跨循环因果未被完全清除的残留。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-005
  zh_cn: 逻辑完全异常区
  code: LOGICALLY_ABNORMAL_ZONE
  definition: 允许真正逻辑冲突的非主线高难区；必须明显警告且有不死人解。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-006
  zh_cn: 部分高危碰撞区
  code: PARTIAL_HIGH_RISK_COLLISION
  definition: 规则域重叠但仍可用高层因果解释的高危区域。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-007
  zh_cn: 主要纠缠
  code: PRIMARY_ENTANGLEMENT
  definition: 定义一个大区的外部世界轻度纠缠及本地影响。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-008
  zh_cn: 详细观测
  code: DETAILED_OBSERVATION
  definition: 足以描述纠缠对象、表现、应对和终局关系的最低主线完成状态。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-009
  zh_cn: 解决纠缠
  code: ENTANGLEMENT_RESOLUTION
  definition: 实际改变、稳定、切断、转移或治理主要纠缠。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-010
  zh_cn: 永久稳定
  code: PERMANENT_STABILIZATION
  definition: 使大区主要安全状态和阵营好感跨重启继承。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-011
  zh_cn: 纠缠因果
  code: ENTANGLED_CAUSALITY
  definition: 角色被世界碰撞波及时形成的能力、弱点与规则响应组合。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-012
  zh_cn: 关键道具1型
  code: CAUSAL_BOMB_TYPE_1
  definition: 因果炸弹的观测与收束相。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-013
  zh_cn: 关键道具2型
  code: CAUSAL_BOMB_TYPE_2
  definition: 因果炸弹的干涉与引爆相。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-014
  zh_cn: 通用代价
  code: UNIVERSAL_COST
  definition: 个人持有的较小型扭曲因果具象物，用于高权限干预。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-015
  zh_cn: 永久前缀
  code: PERMANENT_PREFIX
  definition: 声明对象可跨循环继承的机械标记，必须有因果来源。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-016
  zh_cn: 永久异常
  code: PERMANENT_ANOMALY
  definition: TPK或高危行为产生、普通重启无法清除的跨循环异常。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-017
  zh_cn: 因果锚点
  code: CAUSAL_ANCHOR
  definition: 世界承认主角团稳定存在过的重启定位。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-018
  zh_cn: 原初锚点
  code: ORIGINAL_ANCHOR
  definition: 角色1交付关键道具之前的根锚点；选择它会使其他锚点失效。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-019
  zh_cn: 因果破产
  code: CAUSAL_BANKRUPTCY
  definition: 所有合法恢复路线消失，当前战役不可恢复。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-020
  zh_cn: 维护缺口
  code: MAINTENANCE_GAP
  definition: Boss被击败但关键道具未引爆时的世界持续恶化状态。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-021
  zh_cn: 因果校准图
  code: CAUSAL_CALIBRATION_GRAPH
  definition: 用于终局的功能关系模型，不显示结局完成度。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-022
  zh_cn: 已知信息记录
  code: KNOWN_INFORMATION_REGISTER
  definition: 记录来源、观察者与可信状态的信息主张集合。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-023
  zh_cn: 记忆主张
  code: MEMORY_CLAIM
  definition: 玩家或角色对过去循环的可登记、可比较、可反驳陈述。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-024
  zh_cn: 亡者视角
  code: DECEASED_VIEW
  definition: 死者受关键道具因果系绳限制的死亡因果观察层。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-025
  zh_cn: 因果系绳
  code: CAUSAL_TETHER
  definition: 限制亡者活动范围并连接其与关键道具的关系。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-026
  zh_cn: 大区独特规则
  code: REGION_UNIQUE_RULE
  definition: 解决大区主要纠缠后立即永久绑定的规则权益。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-027
  zh_cn: 规则装备
  code: RULE_EQUIPMENT
  definition: 规范化语义可执行的可携带规则载体。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-028
  zh_cn: 短规则
  code: SHORT_RULE
  definition: 少量断言、低条件、高权限密度的装备规则。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-029
  zh_cn: 长规则
  code: LONG_RULE
  definition: 多条件、多分支、多段效果、高组合上限的装备规则。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-030
  zh_cn: 战役种子清单
  code: CAMPAIGN_SEED_MANIFEST
  definition: 开局一次生成并固定的所有关键参数、映射与内容版本。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-031
  zh_cn: 团灭重启
  code: TPK_RESTART
  definition: 分支1，处理循环结算而不结束战役。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-032
  zh_cn: 灭世结局
  code: WORLD_DESTRUCTION_ENDING
  definition: 分支2，冻结当前因果链并结束战役。
  status: ACTIVE
  world_aliases: []
- term_id: TERM-R2-033
  zh_cn: 共同梦境回归
  code: SHARED_DREAM_RETURN
  definition: 分支3，实际参与终局者以共同记忆回到现实。
  status: ACTIVE
  world_aliases: []
