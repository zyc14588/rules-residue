schema_version: '1.0'
register_id: RULE-RESIDUAL-R2-DECISIONS
language: zh-CN
status: FROZEN
frozen_at: '2026-08-13'
decision_count: 191
authority_entry: docs/authority/r2/00_R2_AUTHORITY_ENTRY.md
supersession_rules:
- superseded: M1_OPEN_FINAL_WORLD_TRUTH_AND_RETURN_CONDITIONS
  superseded_by:
  - R2-E01
  - R2-E04
  - R2-E07
  - R2-E10
  - R2-E11
  - R2-E18
  effect: M1中为防止代理越权而保持OPEN的主线真相已由项目所有者冻结；安装时必须显式传播。
- superseded: PREVIOUS_R2_DRAFTS_BEFORE_KNOWLEDGE_PARSE
  superseded_by: R2-A01..R2-J24
  effect: 知识库解析前的R2草案无权威效力。
decisions:
- decision_id: R2-A01
  status: FROZEN
  group: R2-A
  option: C
  title: 连续大陆多规则域
  statement: 大陆物理上连续，由可相邻、嵌套、叠加与冲突的局部规则域组成；不采用传统副本大厅。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A02
  status: FROZEN
  group: R2-A
  option: B
  title: 探索解密主导
  statement: 探索、调查与规则推理为主要玩法；战斗承担验证、执行、争夺与生存压力，不能替代规则理解。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A03
  status: FROZEN
  group: R2-A
  option: B
  title: 条件化真相
  statement: 世界存在唯一客观底层因果系统；规则有效性受地点、时间、身份、版本、道具状态、先前行为与循环阶段限制。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A04
  status: FROZEN
  group: R2-A
  option: B-R
  title: 因果公平而非信息公平
  statement: 危险必须服从稳定因果，但不要求提供明显独立信号；线索可极弱、间接或延迟显义。禁止作者临时决定死亡或终局追加规则。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A05
  status: FROZEN
  group: R2-A
  option: C-R
  title: 非对称混合成长
  statement: 成长由认知、社会与有限战斗能力组成，并叠加大区独特装备与极稀有通用代价；常规战力不得成为跨规则域万能解。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A06
  status: FROZEN
  group: R2-A
  option: C
  title: 规则文本是一等对象
  statement: 规则载体拥有发布者、受众、范围、版本、篡改、主张、已观察后果、关系与玩家批注等结构化属性。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A07
  status: FROZEN
  group: R2-A
  option: C
  title: 多声部叠层
  statement: 重要规则事件由官方、私人、档案、教义等多声部共同呈现；地区可有主导声部但不得固定单一风格。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A08
  status: FROZEN
  group: R2-A
  option: C-R
  title: 无硬锁区开放探索
  statement: 原则上不限制区域探索；玩家可强闯高危区并承担极高即死风险；多次团灭信息可能揭示特定地区的真实逃课或速通解。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A09
  status: FROZEN
  group: R2-A
  option: B
  title: 严酷恐怖中的稳定人性
  statement: 世界残酷但队伍关系、可信NPC与共同选择具有真实价值；希望来自长期理解而非突然恩赐。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-A10
  status: FROZEN
  group: R2-A
  option: C
  title: 受控信息不对称
  statement: 角色可因身份、能力、污染与死亡方式获得不同信息；主线真相必须能通过合作重建，关键证据存在可共享路径。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B01
  status: FROZEN
  group: R2-B
  option: C
  title: 破损世界的局部约束
  statement: 高维世界残片通过大量局部因果约束维持自身；许多荒诞规则实际承担稳定结构功能。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B02
  status: FROZEN
  group: R2-B
  option: C
  title: 记录与权限载体并存
  statement: 绝大多数规则文本只是观察记录；少数高权限载体能够提交约束并介入现实。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B03
  status: FROZEN
  group: R2-B
  option: C
  title: 规则层级与局部例外
  statement: 规则存在世界、大陆、区域、地点、实体、临时等层级；更具体规则与特殊代价可形成局部例外。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B04
  status: FROZEN
  group: R2-B
  option: C-R
  title: 逻辑完全异常区
  statement: 少量区域允许真正逻辑异常；必须有明显警告、存在不死人解法、不得阻塞主线，解谜给予高等级奖励。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B05
  status: FROZEN
  group: R2-B
  option: C
  title: 受约束的规则变化
  statement: 规则可因世界事件、玩家行为和循环状态改变，但变化必须服从更高层规律并可追溯。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B06
  status: FROZEN
  group: R2-B
  option: C
  title: 规则残差定义
  statement: 规则变化、覆盖、失效或循环重置会在空间、物质、记忆、语言、人物、关键道具与循环中留下跨规则因果残留。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B07
  status: FROZEN
  group: R2-B
  option: C
  title: 残差可利用
  statement: 残差既是证据，也可成为装备、权限、身份、捷径、漏洞或污染；使用通常伴随风险。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B08
  status: FROZEN
  group: R2-B
  option: C-R
  title: 违规豁免与双层后果
  statement: 触犯规则先执行该规则的豁免协议；失败后同时产生即时效果与长期效果。团灭时概率抽取永久异常，支付通用代价或解决异常源才可抵消。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B09
  status: FROZEN
  group: R2-B
  option: B
  title: 隐藏状态可调查
  statement: 规则可针对玩家未知状态判定，但主线关键隐藏状态必须存在调查路径，不要求明显提示。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B10
  status: FROZEN
  group: R2-B
  option: B-R
  title: 验证必有风险
  statement: 所有真正规则验证必须承担风险；拥有特殊天赋者可支付代价进行安全验证，不存在免费规则鉴定。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B11
  status: FROZEN
  group: R2-B
  option: C-R
  title: 规则碰撞区分类
  statement: 规则域碰撞区分逻辑完全异常区与部分高危区；解法有特殊需求，并允许世界内真实存在的逃课解。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B12
  status: FROZEN
  group: R2-B
  option: C
  title: 真实漏洞型逃课
  statement: 逃课解必须由世界预先存在的旧规则漏洞、身份、时间窗口、残差通道或规则抵消构成；循环只提高可发现性。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B13
  status: FROZEN
  group: R2-B
  option: C-R
  title: 允许主线大逃课
  statement: 玩家可大幅跳过大区乃至提前抵达或击败最终Boss；逃课会错过真结局前置，必须回头补齐。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-B14
  status: FROZEN
  group: R2-B
  option: C
  title: 极少数绝对规则
  statement: 全作只有极少数真正绝对规则；其余规则通常存在定义域、条件或例外。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C01
  status: FROZEN
  group: R2-C
  option: C-R
  title: 可干预重启
  statement: 全团死亡通常触发时间重启；通用代价可按支付量干预重启，最高可影响诡异阵营关系；最终Boss战和部分逻辑完全异常区也可改变结果。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C02
  status: FROZEN
  group: R2-C
  option: C-R
  title: 亡者视角与生命代价
  statement: 死亡角色不能直接与活人交流，但可在亡者视角探索隐藏信息；支付代价后可有限干预物理世界。生命可作为规则承认的高价值代价。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C03
  status: FROZEN
  group: R2-C
  option: C-R
  title: 多锚点与原初回退
  statement: 重启可选择最近有效锚点，或选择原初锚点；选择原初锚点后所有其他锚点失效并须重新激活。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C04
  status: FROZEN
  group: R2-C
  option: C-R
  title: 玩家记忆不可强制遗忘
  statement: 系统最多没收上一轮世界内记录或污染角色认知，不能要求真人玩家遗忘；玩家记忆与当前世界冲突可成为规则事件。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C05
  status: FROZEN
  group: R2-C
  option: C-R
  title: 谨慎跨循环改变
  statement: 宏观历史重置，但合法规则残差可造成跨循环改变；所有改变必须可交叉验证并有因果来源。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C06
  status: FROZEN
  group: R2-C
  option: C-R
  title: 跨循环保留白名单
  statement: 仅保留带永久前缀的项目、个人通用代价、关键道具以及玩家脑中的现实记忆；其他物资和记录默认重置。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C07
  status: FROZEN
  group: R2-C
  option: C
  title: 双机制形态转换
  statement: 关键道具可由主线核心事件从1型转2型；任何TPK令当前形态反相，从而允许错误时机获得2型。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C08
  status: FROZEN
  group: R2-C
  option: A-R
  title: 因果炸弹两相
  statement: 关键道具是外部因果悖论奇点经因果律武器制成的因果炸弹；1型观测与收束，2型干涉与引爆。提前错误使用2型会失去正确对消条件并导向灭世。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C09
  status: FROZEN
  group: R2-C
  option: C
  title: 2型改变世界识别
  statement: 提前持有2型会令规则域、旧设施、阵营和异常实体以不同方式识别主角团；它既是权限也是暴露面。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C10
  status: FROZEN
  group: R2-C
  option: C
  title: 因果加权信息抽取
  statement: 团灭后只抽取一个主要信息单元，由死亡原因、接触规则、未理解证据、区域、道具形态、既有信息、循环次数和主线缺口共同决定。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C11
  status: FROZEN
  group: R2-C
  option: C-R
  title: 送死合法但可致因果破产
  statement: 重复同类死亡仍可提高信息精度但边际收益下降，永久异常概率与强度持续增加；过度送死可使战役只能重开。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C12
  status: FROZEN
  group: R2-C
  option: C
  title: 永久异常按因果附着
  statement: 永久异常可附着于角色、队伍、关键道具或跨循环世界关系，载体由异常来源决定并必须记录。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C13
  status: FROZEN
  group: R2-C
  option: C-R
  title: 通用代价本质与来源
  statement: 通用代价是较小型扭曲因果具象物；主要来自超高难谜题、大区最终任务与阵营最终任务，并保留极少数固定获取途径防止永久死锁。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C14
  status: FROZEN
  group: R2-C
  option: C
  title: 独立豁免协议
  statement: 每条规则拥有自己的豁免协议；成功可避免、削弱或推迟后果。极少数绝对规则可以没有普通豁免。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C15
  status: FROZEN
  group: R2-C
  option: A-R
  title: 允许主动自我了结
  statement: 玩家可随时让角色自我了结，不提供菜单式安全重开；每次都会留下跨循环且逐步加重的负面影响，不得用于刷取通用代价。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-C16
  status: FROZEN
  group: R2-C
  option: A-R
  title: 正常无永久角色死亡
  statement: 正常规则与Boss战不永久删除角色；永久死亡只用于长战役中玩家退出并换人时的正式退场。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D01
  status: FROZEN
  group: R2-D
  option: C
  title: 混合现实关系
  statement: 主角团可由熟人、半熟人与陌生人混合组成，均来自现实层但不要求同一地点或时间。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D02
  status: FROZEN
  group: R2-D
  option: C-R
  title: 标准四人支持二至六人
  statement: 标准平衡队伍为4人，正式支持2—6人；主线不得依赖固定职业，人数缩放不能只改生命值。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D03
  status: FROZEN
  group: R2-D
  option: C-R
  title: 进入时抽取纠缠因果
  statement: 角色在世界碰撞中被波及时抽取一条纠缠因果，包含能力、弱点、规则响应和永久风险。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D04
  status: FROZEN
  group: R2-D
  option: C
  title: 背景组合式角色创建
  statement: 角色由现实背景、核心专长、社会关系、生存短板、初始纠缠因果与可成长特殊天赋组成，不设硬职业。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D05
  status: FROZEN
  group: R2-D
  option: C-R
  title: 双层能力结构
  statement: 第一层为常规行动能力；第二层覆盖规则校验、判定干预、代价识别、信息收集及可扩展规则交互能力。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D06
  status: FROZEN
  group: R2-D
  option: C
  title: 永久前缀成长
  statement: 基础角色恒定；本轮训练与普通增益重置；只有明确获得永久前缀且具因果来源的成长跨循环保留。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D07
  status: FROZEN
  group: R2-D
  option: C-R
  title: 所有装备都是规则
  statement: 正式装备均为可携带规则载体；规范化长规则功能总量与组合上限更高，短规则权限密度、直接性与穿透力更强。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D08
  status: FROZEN
  group: R2-D
  option: B
  title: 通用代价个人持有
  statement: 所有通用代价归个人，不设队伍公共池；转移和共同支付必须由明确规则与持有人自愿授权。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D09
  status: FROZEN
  group: R2-D
  option: C
  title: 生命支付需本人授权
  statement: 主动支付生命或个人代价必须由承担角色的玩家明确授权；多数表决、控制技能或代理不得伪造同意。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D10
  status: FROZEN
  group: R2-D
  option: C
  title: 观察者分发信息
  statement: 信息按实际观察来源分别交付，系统只记录角色声称看见什么，由玩家自行选择共享或隐瞒。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D11
  status: FROZEN
  group: R2-D
  option: C
  title: 现实记忆可指导行动
  statement: 玩家可依据现实记忆避险、输入密码或选择路线，但世界可要求物理证据、身份或权限才承认该知识。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D12
  status: FROZEN_WITH_DEFERRED_SPEC
  group: R2-D
  option: C-DEFERRED
  title: 记忆主张机制
  statement: 建立可登记、比较、关联和验证的记忆主张机制；可信度、隐私、AI处理与UI细节延后决定。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D13
  status: FROZEN
  group: R2-D
  option: C-R
  title: 亡者因果系绳
  statement: 亡者视角跟随关键道具行进，不能超出规定物理范围，也不能脱离队伍进行无风险全图侦察。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D14
  status: FROZEN
  group: R2-D
  option: C
  title: 受控队内冲突
  statement: 合作为默认；允许隐瞒、诱惑、误识与玩家选择的背叛。直接伤害、夺取代价或永久改变他人须预授权或由可追溯规则强制。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D15
  status: FROZEN
  group: R2-D
  option: C
  title: 正式退场与世界内加入
  statement: 退出玩家的旧角色正式永久死亡或离队；新角色通过世界内通道加入，获得阶段匹配基础能力与公开档案，不成为空降答案。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D16
  status: FROZEN
  group: R2-D
  option: C
  title: 缺席协议
  statement: 开团时选择锚点停留、受限代理、残响跟随或授权托管；未经本人授权不得消费永久资源、支付生命或做不可逆操作。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D17
  status: FROZEN
  group: R2-D
  option: C
  title: 公开档案与私人记忆分离
  statement: 新加入玩家获得队伍公开整理和稳定验证的信息，不自动获得私人幻觉、秘密、亡者视角与未共享现实记忆。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-D18
  status: FROZEN
  group: R2-D
  option: C
  title: 因果破产重开
  statement: 因果破产后创建新战役；可复用角色概念和玩家现实知识，但不继承永久装备、代价、锚点、阵营关系、异常或关键道具状态。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E01
  status: FROZEN
  group: R2-E
  option: C-R
  title: 高维坍缩残片
  statement: 大陆是高维世界坍缩时遗留的维度残片，与现实及多个其他世界存在纠缠或碰撞。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E02
  status: FROZEN
  group: R2-E
  option: C-R
  title: 纯粹倒霉的主角团
  statement: 主角团没有被选择，只是被异常因果扫中卷入异世界，在求生中成为潜在外部变量。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E03
  status: FROZEN
  group: R2-E
  option: C-R
  title: 碰撞产生纠缠因果
  statement: 纠缠因果在世界碰撞波及角色时产生，连接个人现实因果与大陆异常。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E04
  status: FROZEN
  group: R2-E
  option: C-R
  title: 角色1为因果律武器载体
  statement: 角色1是高维幸存者为文明延续留下的因果律武器的一种表现载体，具有可交流人格但使命优先。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E05
  status: FROZEN
  group: R2-E
  option: C-R
  title: 角色1使命优先
  statement: 角色1必须守护残余文明、切断外部纠缠并修复碰撞损伤，会用一切手段达成使命；主角团只是重要尝试路线之一。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E06
  status: FROZEN
  group: R2-E
  option: C
  title: 外部因果使用条件
  statement: 关键道具必须由来自系统外且拥有纠缠因果者携带或驱动；角色1属于内部系统，不能独立完成最终操作。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E07
  status: FROZEN
  group: R2-E
  option: C
  title: Boss为污染稳定者
  statement: 最终Boss既受扭曲节点污染并制造灾难，也承担封印与局部稳定职责，阻止任何人接触最终节点。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E08
  status: FROZEN
  group: R2-E
  option: C-R
  title: Boss聚合构成
  statement: Boss融合失败路线主角团、历代牺牲者、负责封印的高维幸存者与扭曲因果，保留多层冲突意识。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E09
  status: FROZEN
  group: R2-E
  option: C-R
  title: 内部维护与外部机缘
  statement: 系统整体因果崩溃无法仅靠内部修复；Boss是濒临崩溃系统维护者，外部介入既可能修复也可能撞碎世界，主角团是重要机缘。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E10
  status: FROZEN
  group: R2-E
  option: C
  title: 最终扭曲节点
  statement: 封印核心由互不兼容的历史、被删除现实、未来与跨世界错误连接叠加形成，并非单一怪物。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E11
  status: FROZEN
  group: R2-E
  option: C-R
  title: 因果炸弹终局原理
  statement: 关键道具由主角团外部介入造成的悖论奇点制成；正确引爆可解除异常纠缠并回到现实，错误引爆会摧毁濒临崩溃的异世界。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E12
  status: FROZEN
  group: R2-E
  option: C
  title: 战胜Boss即取得控制权
  statement: Boss可被杀死、压制、分离人格、解除权限或谈判交权；核心是取得最终节点接触控制权。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E13
  status: FROZEN
  group: R2-E
  option: C-R
  title: 前置同时影响战斗与结局
  statement: 缺少必要前置会提高Boss难度，并使关键道具无法正确进入真结局；提前挑战保持真实风险。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E14
  status: FROZEN
  group: R2-E
  option: C
  title: 多维真结局前置
  statement: 真结局依赖关键道具完整、因果模型、权限、阵营功能、Boss处理和必要代价等多个因果维度共同成立。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E15
  status: FROZEN
  group: R2-E
  option: C
  title: 无3型道具
  statement: 不存在关键道具3型；同一个2型执行同一高权限操作，结果由完整因果准备决定为对消或解封毁灭。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E16
  status: FROZEN
  group: R2-E
  option: C-R
  title: 阵营为局部纠缠应对方案
  statement: 不同诡异阵营是破损世界针对其他轻微异常纠缠形成的不同应对方案，各掌握局部技术与片面真相。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E17
  status: FROZEN
  group: R2-E
  option: B-R
  title: 灭世为正式终局
  statement: 世界毁灭后战役结束进入结算，不再触发普通重启。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E18
  status: FROZEN
  group: R2-E
  option: A-R
  title: 共同梦境回归
  statement: 真结局回到现实表现为所有实际回归参与者共同记得的一场梦；它是结局演出而非否定大陆真实存在。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E19
  status: FROZEN
  group: R2-E
  option: B-R
  title: 角色1死亡即灭世
  statement: 角色1死亡会令因果律武器与最终稳定链失效，直接进入灭世结局，不存在替代继承路线。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-E20
  status: FROZEN
  group: R2-E
  option: C-R
  title: 隐藏且参数化的真相揭露
  statement: 核心信息默认隐藏，按探索进度和证据链发现；固定因果骨架结合战役种子参数，降低外场固定攻略的全流程速通能力。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F01
  status: FROZEN
  group: R2-F
  option: B
  title: 六大区与终局区
  statement: 首发大陆由6个主要大区和1个终局区构成。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F02
  status: FROZEN
  group: R2-F
  option: C
  title: 纠缠与本地应对
  statement: 每个大区围绕一种轻度外部世界纠缠及本地文明应对方案设计，地貌与文化服务于因果冲突。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F03
  status: FROZEN
  group: R2-F
  option: C
  title: 网状开放拓扑
  statement: 大陆采用网状开放结构；大区可多路连接、跨区绕行，终局坍缩区早期可见并可尝试接近。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F04
  status: FROZEN
  group: R2-F
  option: C-R
  title: 混合边界与异常区锁入
  statement: 普通高危区使用渐变或突变边界并保留代价撤离方式；逻辑完全异常区有明显警告，执意进入后可适用难以撤退的锁入结构。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F05
  status: FROZEN
  group: R2-F
  option: C-R
  title: 禁止完美逃课
  statement: 每区有相对可靠正常路线与多个非标准路线；任何逃课至少损失风险、资源、奖励、阵营、前置、Boss强度或补课成本之一。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F06
  status: FROZEN
  group: R2-F
  option: C-R
  title: 扩展因果校准系统
  statement: 主线记录包含已知信息、因果关系网、因果校准图和个人通用代价相关信息，不显示真结局百分比。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F07
  status: FROZEN
  group: R2-F
  option: C
  title: 因果维度覆盖
  statement: 真结局要求覆盖固定因果功能维度，允许由不同大区、阵营或高难内容提供等价组合。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F08
  status: FROZEN
  group: R2-F
  option: C-R
  title: 观测可推进，解决得巨奖
  statement: 对主要纠缠完成详细观测即可推进主线；真正解决纠缠可获得通用代价、阵营好感、大区奖励与最终Boss显著削弱。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F09
  status: FROZEN
  group: R2-F
  option: C-R
  title: 大区状态三阶段
  statement: 仅观测在重启后恢复；解决纠缠并完成额外要求后大区可跨循环保持安全，并继承对应阵营好感。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F10
  status: FROZEN
  group: R2-F
  option: C-R
  title: 每区至少一个逻辑完全异常区
  statement: 每个大区至少设置一个逻辑完全异常区，作为完整解决该区主要纠缠的前置之一，但不阻挡观测、离区或普通主线。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F11
  status: FROZEN
  group: R2-F
  option: C
  title: 边界与嵌入碰撞
  statement: 规则碰撞既可发生于大区边界，也可作为时间窗口、移动边界或外部规则嵌入大区内部。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F12
  status: FROZEN
  group: R2-F
  option: C-R
  title: 固定锚点与高阶自建
  statement: 默认锚点固定、稀少且条件激活；达成特殊条件后可支付个人通用代价在任意合法地点建立锚点。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F13
  status: FROZEN
  group: R2-F
  option: C
  title: 世界内快速移动
  statement: 快速移动依赖交通、阵营路线、身份、残差通道和规则捷径；锚点只负责重启定位，不默认传送。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F14
  status: FROZEN
  group: R2-F
  option: C
  title: 分层因果地图
  statement: 地图包含地理、规则域、历史版本、阵营、锚点、残差和记忆主张层；世界内地图默认随循环重置。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F15
  status: FROZEN
  group: R2-F
  option: C
  title: 手工骨架参数化种子
  statement: 地区主题、核心人物、主因果与谜题方法手工固定；局部规则参数、文档映射、NPC身份、关系、路线和前置组合由种子确定。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F16
  status: FROZEN
  group: R2-F
  option: C
  title: 每区二至三种应对方案
  statement: 每个大区以2—3种局部应对方案和阵营为核心，并受到跨区势力技术、贸易、宗教或武装影响。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F17
  status: FROZEN
  group: R2-F
  option: C-R
  title: 残余文明但弱化日常
  statement: 大陆存在城镇、制度和普通人，但日常生活只用于世界真实性、保护价值与恐怖对照，不作为主要内容重心。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F18
  status: FROZEN
  group: R2-F
  option: C-R
  title: 装备与大区独特规则双奖励
  statement: 大区装备需获得并完成永久化；解决大区主要纠缠时额外获得一条立即永久绑定的大区独特规则。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F19
  status: FROZEN
  group: R2-F
  option: C-R
  title: 其他世界不可访问
  statement: 其他世界只能以残差、投影、通信或短暂重叠介入；强行跨越边界直接触发灭世并终止战役。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F20
  status: FROZEN
  group: R2-F
  option: C-R
  title: 允许先Boss后补课
  statement: 玩家可极端逃课先取得Boss控制权，暂不引爆2型，再返回大区补齐前置；期间进入持续恶化的维护缺口状态。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-F21
  status: FROZEN
  group: R2-F
  option: C
  title: 主导与反向声部
  statement: 每个大区有一个主导文本声部和至少两个反向声部，用于表现立场、版本、代价与信息操纵。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G01
  status: FROZEN
  group: R2-G
  option: C
  title: 三分支内部变体
  statement: 顶层始终为团灭重启、世界毁灭、终结循环回归现实三分支；各分支可按角色、阵营、大区与选择产生结算变体。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G02
  status: FROZEN
  group: R2-G
  option: C
  title: 循环结算
  statement: 团灭触发循环结算，处理死亡因果、信息、异常、道具反相、锚点与重启干预，但不结束战役。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G03
  status: FROZEN
  group: R2-G
  option: C
  title: Boss后维护缺口
  statement: 击败Boss后可返回大陆补课，但世界持续恶化、路线与阵营变化、Boss可能恢复；不能无限期安全拖延。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G04
  status: FROZEN
  group: R2-G
  option: C
  title: 主动终局引爆
  statement: 2型最终引爆必须由玩家完成明确世界内动作；击败Boss不会自动引爆，玩家可暂缓。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G05
  status: FROZEN
  group: R2-G
  option: A-R
  title: 不弹不可逆确认
  statement: 为沉浸感不提供系统确认弹窗；只有语义明确、对象明确且满足条件的最终动作才会生效，含糊讨论不得误触发。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G06
  status: FROZEN
  group: R2-G
  option: C
  title: 灭世因果变体
  statement: 错误引爆、角色1死亡、强行跨界及其他明确世界级终止行为统一归入分支2，但使用不同过程与审计。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G07
  status: FROZEN
  group: R2-G
  option: C-R
  title: 结局判定前可干预
  statement: 进入正式结局判定前可支付通用代价干预；一旦灭世被世界接受，剥夺所有玩家控制权并禁止任何撤销。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G08
  status: FROZEN
  group: R2-G
  option: C
  title: 异常区终局权限
  statement: 极少数逻辑完全异常区可触发战役终止，但必须明显警告、不死人解、非主线必经、因果可追溯且不随机。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G09
  status: FROZEN
  group: R2-G
  option: C-R
  title: 六区观测与道具完整最低条件
  statement: 真结局最低资格至少包含全部六大区主要纠缠的详细观测和关键道具完整性。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G10
  status: FROZEN
  group: R2-G
  option: A-R
  title: 观测即有资格，解决降难
  statement: 完成六区观测即可进入最困难真结局判定；解决的大区越多，Boss和校准阶段越容易，全部观测只是最低要求。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G11
  status: FROZEN
  group: R2-G
  option: C
  title: 角色1存活且功能有效
  statement: 真结局要求角色1存活并维持因果律武器功能，但玩家不必与其友好或完全合作。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G12
  status: FROZEN
  group: R2-G
  option: C
  title: 分离Boss维护与扭曲
  statement: 真结局可用多种方式战胜Boss，但必须正确分离其维护职责、失败人格与扭曲节点。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G13
  status: FROZEN
  group: R2-G
  option: C
  title: 阵营功能替代
  statement: 阵营提供边界稳定、人格分离、权限、代价承载或维护接管等功能替代，不存在唯一正确阵营。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G14
  status: FROZEN
  group: R2-G
  option: C
  title: 通用代价只补误差
  statement: 通用代价可修补校准缺口、降低风险或替代非核心奖励，不能替代六区观测、道具完整、角色1存活与必要Boss处理。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G15
  status: FROZEN
  group: R2-G
  option: C
  title: 功能性诊断
  statement: 因果校准图和1型只提示无法闭合、缺维护者、坐标不稳、权限冲突或道具受损等功能问题，不显示任务清单与完成率。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G16
  status: FROZEN
  group: R2-G
  option: C-R
  title: Boss战入场者回归
  statement: 回归名单以进入Boss战时实际参与和操作角色的玩家为准；名单锁定后，战中死亡或短暂技术断线不自动剥夺资格。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G17
  status: FROZEN
  group: R2-G
  option: C-R
  title: 共同核心记忆
  statement: 角色层共享大陆、循环、队友、角色1、Boss与终局等核心事实；现实玩家的实际记忆、理解和遗漏不可被游戏强制统一。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G18
  status: FROZEN
  group: R2-G
  option: A-R
  title: 回归仅为封闭演出
  statement: 回归现实后只保留共同记忆，不保留机械异常、装备或能力；剧情在结局演出结束，不提供可游玩后日谈。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G19
  status: FROZEN
  group: R2-G
  option: C-R
  title: Boss恢复但永久大区奖励保留
  statement: 补课期间团灭后Boss默认恢复并丢失最终节点控制权；已永久化的大区规则、装备、好感和削弱继续保留。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G20
  status: FROZEN
  group: R2-G
  option: C-R
  title: 冻结终止链与参战履历
  statement: 灭世存档冻结，保留终止因果摘要；同一战役谱系未来达成真结局时，将历次失败作为参战履历公开，不提供机械继承。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G21
  status: FROZEN
  group: R2-G
  option: C
  title: 固定维度参数化答案
  statement: 真结局所需因果维度固定；具体来源、Boss人格顺序、权限载体和校验排列由战役种子在开局时确定。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-G22
  status: FROZEN
  group: R2-G
  option: C
  title: 叙事结算与因果审计
  statement: 结局显示直接行为、道具状态、Boss处理、已满足维度、主要缺口、异常、代价及大区阵营结果，不公开无关未探索答案。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H01
  status: FROZEN
  group: R2-H
  option: B-R
  title: 二至一百小时弹性战役
  statement: 常规完整战役以35—60小时设计；支持约2小时极端逃课速通和约100小时全部内容体验。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H02
  status: FROZEN
  group: R2-H
  option: B-R
  title: 二至六小时会话
  statement: 标准会话建议3—4小时，正式支持2—6小时。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H03
  status: FROZEN
  group: R2-H
  option: C
  title: 循环长度由行为决定
  statement: 一个循环可在数十分钟内结束，也可跨多次会话，不能人为绑定单次会话。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H04
  status: FROZEN
  group: R2-H
  option: C
  title: 会话存档与因果锚点分离
  statement: 可在场景、回合、判定或对话等稳定行动边界保存；加载存档不触发重启或改变世界因果。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H05
  status: FROZEN
  group: R2-H
  option: C
  title: 世界内因果压力钟
  statement: 世界碰撞、阵营行动、Boss维护、2型暴露和纠缠扩张形成多个压力钟，主要通过可观察世界现象呈现。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H06
  status: FROZEN
  group: R2-H
  option: C
  title: 有意义流程详玩
  statement: 只有具规则、资源或叙事意义的旅行、补给与日常流程详细游玩；普通安全旅程可压缩。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H07
  status: FROZEN
  group: R2-H
  option: C
  title: 软阶段结构
  statement: 战役分求生、建模、干预、终局四个软阶段，由知识与世界状态驱动，不以章节墙限制越级探索。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H08
  status: FROZEN
  group: R2-H
  option: C
  title: 固定依赖可变证据
  statement: 高层因果依赖固定，支持从不同大区、阵营、文本、亡者视角和团灭信息获得证据。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H09
  status: FROZEN
  group: R2-H
  option: C
  title: 锁定因果与开放裁定
  statement: 底层因果和已定义机械由规则系统锁定；主持人解释自然语言与开放行动，不得临时改真相、定义域或代价。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H10
  status: FROZEN
  group: R2-H
  option: C
  title: AI受约束生成
  statement: 核心因果人工定义；AI只生成场景描述、NPC表达、非关键细节和既定结果叙述，不得创造致命规则、结局条件或永久代价。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H11
  status: FROZEN
  group: R2-H
  option: C
  title: 现场隐藏与事后审计
  statement: 现场展示骰点、可观察结果、已知修正与明确代价；隐藏条件不公开，循环/结局或授权审计提供更详细因果记录。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H12
  status: FROZEN
  group: R2-H
  option: C-R
  title: 行动验证而非骰子答题
  statement: 普通规则验证由角色实际行动侧面完成，骰子只判定执行与风险；规则校验是可选天赋，队伍不保证拥有。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H13
  status: FROZEN
  group: R2-H
  option: C
  title: 区域距离带混合战斗
  statement: 战斗使用功能区域、距离带、规则域边界、因果节点和可交互对象；关键战斗可加载更精细2D地图。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H14
  status: FROZEN
  group: R2-H
  option: C-R
  title: 高致死但技能有效
  statement: 战斗整体高致死，知识、撤退、规则利用、装备和常规技能都能降低风险；技能不能绕过目标存在条件或绝对规则。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H15
  status: FROZEN
  group: R2-H
  option: C
  title: 多阶段规则Boss战
  statement: Boss战同时处理人格层、维护权限、战场规则、常规威胁、关键道具和大区/阵营结果，生命值只是部分手段。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H16
  status: FROZEN
  group: R2-H
  option: C
  title: 多维人数缩放
  statement: 2—6人通过并发目标、信息压力、行动经济、规则攻击面与替代路线缩放，不只改敌人生命值。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H17
  status: FROZEN
  group: R2-H
  option: B-R
  title: Boss入场锁定回归名单
  statement: 在正式进入Boss战的第一个不可逆阶段锁定当时实际操作的玩家名单；之后加入者不能进入回归名单。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H18
  status: FROZEN
  group: R2-H
  option: C
  title: 世界内记录与外部笔记
  statement: 世界内笔记可被重置、篡改或作为凭证；玩家外部笔记永久保留但不能自动作为世界承认证据。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H19
  status: FROZEN
  group: R2-H
  option: C
  title: 角色1区域沉浸式教程
  statement: 角色1交付区承担真实主战役教程，允许受伤、团灭和拒绝；初期错误不会轻易造成因果破产。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H20
  status: FROZEN
  group: R2-H
  option: C-R
  title: 失败非机械，真结局高资源开局
  statement: 失败战役只保留知识、履历、成就和外观；真结局存档可为后续新战役解锁有限更高开局资源，但不继承答案或永久规则。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H21
  status: FROZEN
  group: R2-H
  option: C
  title: 原种子或新种子重开
  statement: 重开可选择原种子复验推理或新种子获得受控变化；均重置机械状态并标记战役谱系。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-H22
  status: FROZEN
  group: R2-H
  option: C
  title: 多阶段终局判定
  statement: 终局依次处理因果模型、Boss维护、回归连接、道具校准、代价分配、规则执行与引爆；不得由一次独立随机失败否定全部准备。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I01
  status: FROZEN
  group: R2-I
  option: C
  title: 现实主义底层与规则化超现实
  statement: 正常环境采用低饱和可信现实质感，规则执行、碰撞、记忆冲突、异常区和关键道具干预时才突破现实。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I02
  status: FROZEN
  group: R2-I
  option: C-R
  title: 纯2D混合表现
  statement: 使用纯2D场景、角色立绘、分层地图、规则界面、特效和关键动态演出；不制作2.5D或3D自由场景。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I03
  status: FROZEN
  group: R2-I
  option: C
  title: 异常分层可见
  statement: 轻微异常通过细节与构图偏差表现；高危规则可观察但不一定明显；逻辑完全异常区显著警告，规则执行可强烈破坏画面。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I04
  status: FROZEN
  group: R2-I
  option: C
  title: 实体逐层显形
  statement: 怪异实体随观测、证据和规则理解逐步获得稳定视觉表现，初期可表现为缺失轮廓、错误倒影或互斥形象。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I05
  status: FROZEN
  group: R2-I
  option: C
  title: 原始载体与辅助层
  statement: 玩家先看到世界内告示、档案、合同、经文、地图、广播等；辅助阅读层提供可访问文本、来源、版本、位置、批注与关联。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I06
  status: FROZEN
  group: R2-I
  option: C-R
  title: 内部多声部标记不可见
  statement: 每份文本内部标记载体、发布者、受众、版本、可靠状态、范围、功能与声部，但结构化标签不得直接向玩家显示。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I07
  status: FROZEN
  group: R2-I
  option: C
  title: 只显示可确认属性
  statement: 界面可显示角色确认的发布者、日期、篡改、权限痕迹与版本差异，不直接显示真假、当前有效或真结局必需。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I08
  status: FROZEN
  group: R2-I
  option: C
  title: 可追踪动态文本
  statement: 异常文本可因规则、身份、道具形态、循环或污染变化；旧版本必须通过记录、截图、记忆或残差留下可调查痕迹。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I09
  status: FROZEN
  group: R2-I
  option: C
  title: 渐进式信息披露
  statement: 原文、来源、差异、关系网、因果主张、代价关系和终局用途按需分层展开，避免单界面信息过载。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I10
  status: FROZEN
  group: R2-I
  option: C
  title: 规则文本化装备界面
  statement: 装备以规范化规则为核心；长规则显示条件链、多段效果与选择，短规则显示极简断言、对象、高代价或次数限制。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I11
  status: FROZEN
  group: R2-I
  option: C
  title: 关键道具反相视觉
  statement: 1型与2型共享同一因果核心轮廓；1型内折、收束、稳定，2型外翻、展开、侵入。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I12
  status: FROZEN
  group: R2-I
  option: C
  title: 因死因变化的重启演出
  statement: 重启演出反映死亡规则、永久异常、道具反相、锚点与信息抽取；重复路线可加速，但新信息不可自动跳过。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I13
  status: FROZEN
  group: R2-I
  option: C
  title: 亡者因果层视觉
  statement: 亡者视角保留关键道具附近物理轮廓，并叠加因果系绳、规则轨迹、死者残响与旧版本空间，不提供全知。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I14
  status: FROZEN
  group: R2-I
  option: C
  title: 声音线索有等价渠道
  statement: 声音可承担节奏、广播、钟声、方向与双声道线索，但必须提供视觉记录、振动、字幕结构或转录等价信息。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I15
  status: FROZEN
  group: R2-I
  option: C
  title: 稀疏自适应音乐
  statement: 音乐根据规则域、压力、道具形态、阵营和Boss人格变化；沉默可成为规则状态，但需可访问性替代。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I16
  status: FROZEN
  group: R2-I
  option: C
  title: 重点语音化
  statement: 重点语音覆盖角色1、Boss人格、大区核心NPC、关键广播、死亡/循环信息与结局；参数化普通文本以文字为主。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I17
  status: FROZEN
  group: R2-I
  option: C
  title: Boss人格稳定视听语法
  statement: Boss不同人格层与维护职责通过构图、轮廓、声线、文本格式、规则和音乐动机稳定区分。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I18
  status: FROZEN
  group: R2-I
  option: C-R
  title: 技能化地图记录与主持全图
  statement: 多层地图与玩家手工主张并存；有地图相关技能者可记录侦察地图，主持人始终访问完整权威地图。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I19
  status: FROZEN
  group: R2-I
  option: C
  title: 机械信息等价可访问
  statement: 核心解谜不得只依赖颜色、字体、闪烁、立体声、快速阅读或精细操作；可降低表现强度且不直接泄露答案。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I20
  status: FROZEN
  group: R2-I
  option: C
  title: 人工因果与受约束生成
  statement: 世界真相、致命规则、定义域、Boss、结局、永久代价和异常区解法必须人工定义；生成模型只产出结构化约束内的表现层。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I21
  status: FROZEN
  group: R2-I
  option: C
  title: 组件化种子与一致性验证
  statement: 战役种子由手工谜题组件、参数槽和自动一致性验证构成；开局固定答案，失败后不得改写。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I22
  status: FROZEN
  group: R2-I
  option: C-R
  title: 全内容完整交叉验证
  statement: 每个大区以及发布前整个游戏必须对全部正式内容和跨系统关系完成完整交叉验证，不能以抽样或单路线代替。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I23
  status: FROZEN
  group: R2-I
  option: C
  title: 中文首发的权威语义层
  statement: 规则先有规范语义ID，再映射中文表现；首版仅中文，但底层保留语言包、回退和语言专属等价谜题能力。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-I24
  status: FROZEN
  group: R2-I
  option: C-R
  title: 安全工具与未成年人绝对红线
  statement: 开团前设置内容边界，游玩中可暂停、淡出或替代表现；任何针对未成年人的性侵犯、性剥削、性胁迫、诱骗、交易、奴役或性化呈现绝对禁止。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J01
  status: FROZEN
  group: R2-J
  option: C
  title: 分层权威文档组
  statement: R2使用统一入口、主题权威文档、机器登记、模板、M2输入、验收和变更控制组成的分层包。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J02
  status: FROZEN
  group: R2-J
  option: C
  title: 明确权威优先级
  statement: 冻结决策高于规范术语与语义，高于系统规范、大区内容、任务遭遇、表现文本和示例。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J03
  status: FROZEN
  group: R2-J
  option: C
  title: 稳定ID全覆盖
  statement: 决策、规则、装备、永久规则、纠缠因果、大区、阵营、NPC、锚点、终局维度、种子参数和验收用例均分配稳定ID。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J04
  status: FROZEN
  group: R2-J
  option: C
  title: 规范术语与世界内称谓分离
  statement: 设计与机械文件使用统一系统术语；世界内可存在多种地方称谓，通过术语表映射。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J05
  status: FROZEN
  group: R2-J
  option: C
  title: 四层可见性隔离
  statement: 玩家可见、主持隐藏因果、机械权威、审计验收数据分层存放；客户端和模型只获得当前权限所需层。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J06
  status: FROZEN
  group: R2-J
  option: C
  title: 规则三层表达
  statement: 每条规则同时具有规范化语义、机器可执行结构和世界内表现文本，并保持稳定可追踪映射。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J07
  status: FROZEN
  group: R2-J
  option: C
  title: 语义结构判定长短
  statement: 装备长短由条件、分支、效果、对象和权限密度等规范语义计算，文学字数不能改变机械分类。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J08
  status: FROZEN
  group: R2-J
  option: C
  title: 完整不可变种子清单
  statement: 创建战役时一次生成规则参数、文档映射、NPC身份、阵营关系、路线、终局来源、Boss排列与内容版本清单并固定。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J09
  status: FROZEN
  group: R2-J
  option: C
  title: 失败后禁止改答案
  statement: 战役开始后不得因为玩家猜中、读攻略、团灭或主持追求反转修改正确答案与关键参数。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J10
  status: FROZEN
  group: R2-J
  option: C
  title: 全内容跨系统验证
  statement: 验证所有内容单元及其与循环、锚点、关键道具、阵营、Boss、结局、地图、本地化和可访问性的关系。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J11
  status: FROZEN
  group: R2-J
  option: C
  title: 完整大区状态链验收
  statement: 单区验收必须覆盖首次进入、观测、高危、异常区不死人解、逃课、损失、解决、永久化、奖励、团灭、Boss影响、人数与地图差异。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J12
  status: FROZEN
  group: R2-J
  option: C
  title: 多类端到端战役验收
  statement: 发布前验证常规、极端逃课、最低前置真结局、低风险真结局、先Boss后补课、三类灭世、因果破产、重复团灭、原种子和NG+。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J13
  status: FROZEN
  group: R2-J
  option: C
  title: 路线代价审计
  statement: 每条逃课必须有不可忽略代价；发现低风险、低成本、全奖励、兼容真结局的稳定路线即验收失败。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J14
  status: FROZEN
  group: R2-J
  option: C
  title: 恢复能力验证器
  statement: 系统区分困难可恢复、依赖固定代价、需原初锚点与正式因果破产；只有所有合法恢复路线消失才宣告不可恢复。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J15
  status: FROZEN
  group: R2-J
  option: C-R
  title: 每次检查重新过滤红线
  statement: 内容安全使用多层硬门禁；每次输入、生成、编辑、转换、测试、构建、发布、运行时生成和迁移检查都必须重新过滤。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J16
  status: FROZEN
  group: R2-J
  option: C
  title: 生成模型最小授权
  statement: 运行时生成模型只可读取当前授权模板、机械结果和必要数据，不得访问全种子、未发现结局或无关隐藏信息。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J17
  status: FROZEN
  group: R2-J
  option: C-R
  title: 最小来源与版本链
  statement: 正式内容至少记录作者、全部修改者、审核者、机械一致性状态和内容/批准版本；生成参与需内部审计。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J18
  status: FROZEN
  group: R2-J
  option: C
  title: 多工具输入输出契约
  statement: Codex负责规划、规格、集成与验收；OpenCode负责Lua和游戏脚本；Grok负责美术；任何越权修改权威设计必须走变更控制。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J19
  status: FROZEN
  group: R2-J
  option: C-R
  title: 首版中文可跳过本地化内容验收
  statement: 首版只交付简体中文，可将多语言内容验收标为不适用，但必须保留稳定文本ID、资源外置、回退和语言专属接口。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J20
  status: FROZEN
  group: R2-J
  option: C
  title: 版本清单与存档迁移
  statement: 战役和存档绑定内容版本；更新使用显式迁移，无法安全迁移时继续归档版本，禁止静默改变进行中答案。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J21
  status: FROZEN
  group: R2-J
  option: C-R
  title: M2完整技术垂直切片
  statement: M2先制作覆盖教程、一个完整大区、异常区、两相道具、循环、亡者、Boss与三分支模拟的垂直切片，并完成完整技术性验证。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J22
  status: FROZEN
  group: R2-J
  option: C
  title: 完整R2交付包
  statement: R2交付必须包括入口、设计总览、冻结决策、术语、系统文档、机器语义、模板、种子、验证、延期、M2输入与独立验收。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J23
  status: FROZEN
  group: R2-J
  option: C
  title: 实施与验收分离
  statement: 权威任务默认由独立验收者固定候选SHA执行只读验收；缺少证据不得推定通过，验收者不得修改候选。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
- decision_id: R2-J24
  status: FROZEN
  group: R2-J
  option: C
  title: 延期登记与变更控制
  statement: 未决细节进入带ID、边界、依赖与最迟阶段的延期登记；冻结后修改必须提交影响分析并重新验收受影响范围。
  notes: []
  source_stage: R2_TOP_LEVEL_GAME_DESIGN
  scope: RULE_RESIDUAL_GAME_PACKAGE
